[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
async-trait = "0.1.89"
sea-orm = { version = "1.1", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-chrono"] }
redis = { version = "0.32.7", features = ["tokio-comp"] }
chrono = { version = "0.4.26", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.115"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tonic = { version = "0.14" }
#序列化和反序列化 protobuf 数据。
prost = "0.14"
prost-types = "0.14"
# 公用的protobuf文件
grpc-dsl = { path = "../grpc-dsl" }
# yaml配置
serde_yml = "=0.0.12"
# 获取本机IP地址
local-ip-address = "0.6.9"
